name: Source Probe

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1-5'

permissions:
  contents: write

jobs:
  source-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          npm install
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe real data sources
        run: python scripts/akshare-source-probe.py
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TUSHARE_ENDPOINT: ${{ secrets.TUSHARE_ENDPOINT }}

      - name: Commit source status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source-status.json
          if git diff --cached --quiet; then
            echo "No source-status changes to commit."
          else
            git commit -m "Update source probe status"
            git push
          fi
